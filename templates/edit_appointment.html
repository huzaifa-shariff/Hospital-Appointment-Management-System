{% extends 'base.html' %}{% block title %}Edit appointment{% endblock %}{% block page_name %}Edit appointment{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">{{ appointment.appointment_code }}</div><h1>Edit appointment</h1><p>Update booking time, care provider, reason or status.</p></div><a class="btn btn-light" href="{{ url_for('appointment_view',id=appointment.appointment_id) }}">Cancel</a></div><form method="post" class="panel form-panel narrow-form"><div class="row g-3"><div class="col-md-6"><label class="form-label">Patient</label><select disabled class="form-select">{% for p in patients %}<option {{ 'selected' if p.patient_id==appointment.patient_id }}>{{ p.full_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Department</label><select required name="department_id" class="form-select">{% for d in departments %}<option value="{{ d.department_id }}" {{ 'selected' if d.department_id==appointment.department_id }}>{{ d.department_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Doctor</label><select required name="doctor_id" class="form-select">{% for d in doctors %}<option value="{{ d.doctor_id }}" {{ 'selected' if d.doctor_id==appointment.doctor_id }}>{{ d.full_name }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Date</label><input type="date" required min="{{ today }}" name="appointment_date" class="form-control" value="{{ appointment.appointment_date }}"></div><div class="col-md-3"><label class="form-label">Time</label><input type="time" required name="appointment_time" class="form-control" value="{{ appointment.appointment_time }}"></div><div class="col-md-6"><label class="form-label">Reason</label><input class="form-control" name="reason" value="{{ appointment.reason or '' }}"></div><div class="col-md-6"><label class="form-label">Symptoms</label><input class="form-control" name="symptoms" value="{{ appointment.symptoms or '' }}"></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status">{% for s in statuses %}<option {{ 'selected' if appointment.status==s }}>{{ s }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3">{{ appointment.notes or '' }}</textarea></div></div><div class="form-actions"><button class="btn btn-primary">Save changes</button></div></form>{% endblock %}
