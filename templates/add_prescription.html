{% extends 'base.html' %}{% block title %}Add prescription{% endblock %}{% block page_name %}Add prescription{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CLINICAL RECORDS</div><h1>New prescription</h1><p>Add diagnosis and treatment information to a patient visit.</p></div><a class="btn btn-light" href="{{ url_for('prescriptions') }}">Back to prescriptions</a></div><form method="post" class="form-layout"><section class="panel form-panel"><div class="row g-3"><div class="col-12"><label class="form-label">Appointment *</label><select required class="form-select" name="appointment_id"><option value="">Select appointment</option>{% for a in appointments %}<option value="{{ a.appointment_id }}">{{ a.appointment_code }} · {{ a.patient }} · {{ a.doctor }} · {{ a.appointment_date }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Diagnosis *</label><input required name="diagnosis" class="form-control" placeholder="e.g. Seasonal allergic rhinitis"></div><div class="col-md-6"><label class="form-label">Medicines</label><textarea name="medicines" rows="3" class="form-control" placeholder="Medicine and strength"></textarea></div><div class="col-md-6"><label class="form-label">Dosage</label><textarea name="dosage" rows="3" class="form-control" placeholder="e.g. 1 tablet twice daily"></textarea></div><div class="col-md-6"><label class="form-label">Duration</label><input name="duration" class="form-control" placeholder="e.g. 5 days"></div><div class="col-12"><label class="form-label">Instructions / medical notes</label><textarea name="instructions" rows="3" class="form-control" placeholder="Care instructions and follow-up"></textarea></div></div></section><div class="form-actions"><a href="{{ url_for('prescriptions') }}" class="btn btn-light">Cancel</a><button class="btn btn-primary"><i class="fa-regular fa-floppy-disk me-2"></i>Save prescription</button></div></form>{% endblock %}
