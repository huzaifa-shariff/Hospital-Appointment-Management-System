{% extends 'base.html' %}{% block title %}Add schedule{% endblock %}{% block page_name %}Add schedule{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CARE TEAM</div><h1>Add doctor schedule</h1><p>Set a recurring weekly appointment window.</p></div><a class="btn btn-light" href="{{ url_for('schedules') }}">Back to schedules</a></div><form method="post" class="panel form-panel narrow-form"><div class="row g-3"><div class="col-md-6"><label class="form-label">Doctor *</label><select required class="form-select" name="doctor_id"><option value="">Select doctor</option>{% for d in doctors %}<option value="{{ d.doctor_id }}">{{ d.full_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Day of week *</label><select class="form-select" name="day_of_week">{% for day in days %}<option>{{ day }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Start time</label><input type="time" required class="form-control" name="start_time" value="09:00"></div><div class="col-md-4"><label class="form-label">End time</label><input type="time" required class="form-control" name="end_time" value="13:00"></div><div class="col-md-4"><label class="form-label">Slot duration (minutes)</label><input type="number" min="5" max="240" required class="form-control" name="slot_duration" value="30"></div></div><div class="form-actions"><a href="{{ url_for('schedules') }}" class="btn btn-light">Cancel</a><button class="btn btn-primary">Save schedule</button></div></form>{% endblock %}
