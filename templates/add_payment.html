{% extends 'base.html' %}{% block title %}Record payment{% endblock %}{% block page_name %}Record payment{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">BILLING</div><h1>Record a payment</h1><p>Enter a manual payment record for a patient visit.</p></div><a class="btn btn-light" href="{{ url_for('payments') }}">Back to payments</a></div><form method="post" class="panel form-panel narrow-form"><div class="row g-3"><div class="col-12"><label class="form-label">Appointment *</label><select required class="form-select" name="appointment_id" id="paymentAppointment"><option value="">Select appointment</option>{% for a in appointments %}<option value="{{ a.appointment_id }}" data-fee="{{ a.consultation_fee }}">{{ a.appointment_code }} · {{ a.patient }} with {{ a.doctor }} · {{ a.appointment_date }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Consultation fee</label><div class="input-group"><span class="input-group-text">₹</span><input readonly id="consultationFee" class="form-control" placeholder="Select an appointment"></div></div><div class="col-md-6"><label class="form-label">Amount received (₹) *</label><input required type="number" step="0.01" min="0.01" name="amount" class="form-control"></div><div class="col-md-6"><label class="form-label">Payment date</label><input type="date" name="payment_date" class="form-control" value="{{ today }}"></div><div class="col-md-6"><label class="form-label">Payment mode *</label><select required class="form-select" name="payment_mode">{% for x in ['Cash','UPI','Card','Bank Transfer'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="payment_status">{% for x in ['Paid','Pending','Refunded'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Transaction reference</label><input class="form-control" name="transaction_reference" placeholder="Optional transaction ID"></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('payments') }}">Cancel</a><button class="btn btn-primary">Save payment</button></div></form>{% endblock %}
